name: your_travel_buddy
description: Your Travel Buddy — a clean, shared trip and budget planning app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.0.0
  timezone: ^0.9.3
  flutter_slidable: ^3.1.1
  http: ^1.2.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  file_picker: ^13.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
